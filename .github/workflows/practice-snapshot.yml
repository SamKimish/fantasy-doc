name: Practice snapshot

# Every 2 hours, record each injured player's practice status from ESPN's commentary, so the app can show
# a full Wed/Thu/Fri trail. Output lives on the `data` branch so the website isn't rebuilt on every run.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Take snapshot
        run: node code/scripts/snapshot.js data/practice.json

      - name: Commit changes
        working-directory: data
        run: |
          if [ -n "$(git status --porcelain practice.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add practice.json
            git commit -m "Practice snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          else
            echo "Nothing to commit."
          fi
